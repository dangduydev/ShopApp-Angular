<app-header></app-header>
<div class="container">
  <div class="intro-section">
    <h1>Đây là trang Home</h1>
    <p>Trang này hiển thị danh sách các sản phẩm, kèm ảnh</p>
    <p>Các bạn có thể chọn xem sản phẩm và mua hàng tại đây</p>
  </div>
  <!-- Có 1 ô search box bên trái, 1 combobox bên phải -->
  <div class="search-box">
    <input
      type="text"
      class="form-control search-input"
      placeholder="Tìm sản phẩm"
    />
    <select name="" id="" class="form-control product-catetory">
      <option value="" selected disabled>Danh mục sản phẩm</option>
      <option value="">Đồ điện tử</option>
      <option value="">Hải sản</option>
      <option value="">Bánh kẹo</option>
    </select>
  </div>
  <div class="row">
    <div class="col-lg-4 col-md-6" *ngFor="let product of products">
      <div class="product-item">
        <img [src]="product.url" alt="Product Image" class="product-image" />
        <h3 class="product-name">{{ product.name }}</h3>
        <p class="product-description">{{ product.description }}</p>
        <p class="product-price">Giá: ${{ product.price }}</p>
      </div>
    </div>
  </div>
</div>
<div class="d-flex justify-content-center">
  <nav aria-label="Page navigation">
    <ul class="pagination">
      <li class="page-item" *ngIf="currentPage > 0">
        <a class="page-link" (click)="onPageChange(0)">First</a>
      </li>
      <li class="page-item" *ngIf="currentPage > 0">
        <a class="page-link" (click)="onPageChange(currentPage - 1)">
          <i class="fa fa-chevron-left"></i>
        </a>
      </li>
      <ng-container *ngFor="let page of visiblePages">
        <li class="page-item" [ngClass]="{ active: page === currentPage + 1 }">
          <a class="page-link" (click)="onPageChange(page - 1)">{{ page }}</a>
        </li>
      </ng-container>
      <li class="page-item" *ngIf="currentPage < totalPages - 1">
        <a class="page-link" (click)="onPageChange(currentPage + 1)">
          <i class="fa fa-chevron-right"></i>
        </a>
      </li>
      <li class="page-item" *ngIf="currentPage < totalPages - 1">
        <a class="page-link" (click)="onPageChange(totalPages - 1)">Last</a>
      </li>
    </ul>
  </nav>
</div>
<app-footer></app-footer>
